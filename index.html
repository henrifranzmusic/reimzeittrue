<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reimzeit — dein Songwriting-Studio</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='64' y2='64'%3E%3Cstop offset='0%25' stop-color='%23e2a53c'/%3E%3Cstop offset='55%25' stop-color='%23c15c47'/%3E%3Cstop offset='100%25' stop-color='%234c9484'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%2314161f'/%3E%3Cpath d='M22 47V21c0-6 6-9 12-7 6 2 7 10 1 13-4 2-9 1-11-2' fill='none' stroke='url(%23g)' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M32 27l10 20' fill='none' stroke='url(%23g)' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='48' cy='18' r='3' fill='%23e2a53c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-950:#14161f; --ink-900:#1b1e2b; --ink-850:#212437;
    --paper:#f3ecdb; --paper-dim:#e9e0c8; --paper-line: rgba(38,42,61,0.09);
    --text-onink:#ece6d6; --text-onink-dim:#a6a293;
    --text-onpaper:#262a3d; --text-onpaper-dim:#6b6656;
    --amber:#e2a53c; --amber-dim:#8a651f; --rust:#c15c47; --teal:#4c9484;
    --line-onink: rgba(236,230,214,0.13);
    --font-display:'Fraunces', serif; --font-body:'Work Sans', sans-serif; --font-mono:'IBM Plex Mono', monospace;
  }
  :root{
    --ink-950:#14161f; --ink-900:#1b1e2b; --ink-850:#212437;
    --paper:#f3ecdb; --paper-dim:#e9e0c8; --paper-line: rgba(38,42,61,0.09);
    --text-onink:#ece6d6; --text-onink-dim:#a6a293;
    --text-onpaper:#262a3d; --text-onpaper-dim:#6b6656;
    --amber:#e2a53c; --amber-dim:#8a651f; --rust:#c15c47; --teal:#4c9484;
    --line-onink: rgba(236,230,214,0.13);
    --font-display:'Fraunces', serif; --font-body:'Work Sans', sans-serif; --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--ink-950); color:var(--text-onink); font-family:var(--font-body); min-height:100vh;}
  #root{display:flex; min-height:100vh;}
  ::selection{background:var(--amber); color:var(--ink-950);}
  button{font-family:var(--font-body); cursor:pointer;}
  textarea, input, select{font-family:var(--font-body);}
  a{color:inherit;}
  .spine{width:76px; flex-shrink:0; background:var(--ink-900); border-right:1px solid var(--line-onink); display:flex; flex-direction:column; align-items:center; padding:20px 0; position:relative;}
  .spine-logo{font-family:var(--font-display); font-weight:600; font-size:20px; color:var(--amber); margin-bottom:28px; line-height:1; text-align:center;}
  .spine-tabs{display:flex; flex-direction:column; gap:6px; width:100%;}
  .spine-tab{background:none; border:none; color:var(--text-onink-dim); padding:14px 4px; display:flex; flex-direction:column; align-items:center; gap:6px; border-left:3px solid transparent; transition:color .15s ease, border-color .15s ease, background .15s ease; width:100%;}
  .spine-tab svg{width:19px; height:19px; opacity:.85;}
  .spine-tab span{font-size:10px; letter-spacing:.04em; text-transform:uppercase; font-weight:500;}
  .spine-tab:hover{color:var(--text-onink); background:rgba(236,230,214,0.04);}
  .spine-tab.active{color:var(--amber); border-left-color:var(--amber); background:rgba(226,165,60,0.08);}
  .spine-foot{margin-top:auto; font-family:var(--font-mono); font-size:9px; color:var(--text-onink-dim); text-align:center; line-height:1.5; padding-top:16px;}
  .main{flex:1; padding:36px 40px 60px; max-width:960px; margin:0 auto; width:100%;}
  .page-head{margin-bottom:28px;}
  .eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--amber); margin:0 0 6px;}
  h1{font-family:var(--font-display); font-weight:600; font-size:32px; margin:0; letter-spacing:-0.01em;}
  .subtext{color:var(--text-onink-dim); font-size:14px; margin:8px 0 0; max-width:60ch; line-height:1.6;}
  .paper{background:var(--paper); color:var(--text-onpaper); border-radius:10px; padding:24px 26px; position:relative;}
  .paper h2, .paper h3{font-family:var(--font-display); color:var(--text-onpaper);}
  .paper .subtext, .paper-dim-text{color:var(--text-onpaper-dim);}
  .btn{border-radius:7px; border:1px solid var(--line-onink); background:transparent; color:var(--text-onink); font-size:13.5px; font-weight:500; padding:9px 16px; display:inline-flex; align-items:center; gap:7px; transition:all .15s ease;}
  .btn:hover{background:rgba(236,230,214,0.06); border-color:rgba(236,230,214,0.3);}
  .btn-amber{background:var(--amber); color:var(--ink-950); border-color:var(--amber);}
  .btn-amber:hover{background:#eeb556; border-color:#eeb556;}
  .btn-onpaper{border-color:rgba(38,42,61,0.25); color:var(--text-onpaper);}
  .btn-onpaper:hover{background:rgba(38,42,61,0.05);}
  .btn:disabled{opacity:.45; cursor:default;}
  .btn-sm{padding:6px 11px; font-size:12.5px;}
  .btn-ghost-onpaper{background:none; border:none; color:var(--text-onpaper-dim); padding:4px 6px;}
  .btn-ghost-onpaper:hover{color:var(--rust);}
  .song-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:14px; margin-top:20px;}
  .song-card{background:var(--ink-900); border:1px solid var(--line-onink); border-radius:9px; padding:16px 17px; cursor:pointer; transition:border-color .15s ease, transform .1s ease; display:flex; flex-direction:column; gap:10px;}
  .song-card:hover{border-color:var(--amber);}
  .song-card-title{font-family:var(--font-display); font-size:17px; font-weight:600; margin:0;}
  .song-card-snippet{font-size:12.5px; color:var(--text-onink-dim); line-height:1.5; margin:0; min-height:36px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .badge{font-family:var(--font-mono); font-size:10px; letter-spacing:.03em; text-transform:uppercase; padding:3px 9px; border-radius:20px; display:inline-flex; width:fit-content; font-weight:500;}
  .badge-idee{background:rgba(160,158,148,0.18); color:#c9c6b8;}
  .badge-entwurf{background:rgba(226,165,60,0.16); color:var(--amber);}
  .badge-fertig{background:rgba(76,148,132,0.18); color:#7fd1bc;}
  .badge-aufgenommen{background:rgba(193,92,71,0.18); color:#e79a86;}
  .song-card-meta{font-family:var(--font-mono); font-size:10..5px; color:var(--text-onink-dim); display:flex; justify-content:space-between; margin-top:auto;}
  .empty-state{border:1px dashed var(--line-onink); border-radius:10px; padding:40px 24px; text-align:center; color:var(--text-onink-dim); margin-top:20px;}
  .empty-state h3{font-family:var(--font-display); color:var(--text-onink); font-weight:600; margin:0 0 6px;}
  .filter-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:18px;}
  .chip{font-family:var(--font-mono); font-size:11.5px; padding:6px 13px; border-radius:20px; border:1px solid var(--line-onink); color:var(--text-onink-dim); background:transparent;}
  .chip.active{background:var(--amber); color:var(--ink-950); border-color:var(--amber);}
  .editor-grid{display:grid; grid-template-columns:1.5fr 1fr; gap:20px; align-items:start; margin-top:6px;}
  @media (max-width:820px){.editor-grid{grid-template-columns:1fr;}}
  .title-input{font-family:var(--font-display); font-size:22px; font-weight:600; background:none; border:none; color:var(--text-onpaper); width:100%; margin-bottom:4px; padding:2px 0;}
  .title-input:focus{outline:none;}
  .status-row{display:flex; gap:8px; align-items:center; margin-bottom:16px;}
  select.status-select{font-family:var(--font-mono); font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; padding:6px 10px; border-radius:20px; border:1px solid rgba(38,42,61,0.2); background:var(--paper-dim); color:var(--text-onpaper);}
  .lyric-area-wrap{background:repeating-linear-gradient(var(--paper) 0px, var(--paper) 27px, var(--paper-line) 28px); border-radius:6px;}
  textarea.lyric-area{width:100%; min-height:420px; background:transparent; border:none; resize:vertical; font-family:var(--font-display); font-size:16px; line-height:28px; color:var(--text-onpaper); padding:2px 4px; outline:none;}
  .word-count{font-family:var(--font-mono); font-size:11px; color:var(--text-onpaper-dim); text-align:right; margin-top:6px;}
  .side-panel{background:var(--ink-900); border:1px solid var(--line-onink); border-radius:10px; padding:18px;}
  .side-panel h3{font-family:var(--font-display); font-size:16px; margin:0 0 4px;}
  .side-panel .subtext{margin-bottom:14px;}
  .rhyme-input-row{display:flex; gap:8px; margin-bottom:14px;}
  .rhyme-input-row input{flex:1; background:var(--ink-850); border:1px solid var(--line-onink); border-radius:7px; color:var(--text-onink); padding:9px 12px; font-size:14px; outline:none;}
  .rhyme-input-row input:focus{border-color:var(--amber);}
  .rhyme-group-label{font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--amber); margin:14px 0 8px;}
  .rhyme-chips{display:flex; flex-wrap:wrap; gap:6px;}
  .rhyme-chip{font-size:13px; padding:5px 10px; border-radius:20px; background:var(--ink-850); border:1px solid var(--line-onink); color:var(--text-onink);}
  .rhyme-chip:hover{border-color:var(--amber); color:var(--amber);}
  .loading-line{font-family:var(--font-mono); font-size:12px; color:var(--text-onink-dim); display:flex; align-items:center; gap:8px;}
  .dot{width:5px; height:5px; border-radius:50%; background:var(--amber); animation:pulse 1s infinite ease-in-out;}
  .dot:nth-child(2){animation-delay:.15s;} .dot:nth-child(3){animation-delay:.3s;}
  @keyframes pulse{0%,100%{opacity:.25;} 50%{opacity:1;}}
  .error-text{color:#e79a86; font-size:12.5px;}
  .yt-form{display:flex; gap:8px; margin-top:18px;}
  .yt-form input{flex:1; background:var(--ink-900); border:1px solid var(--line-onink); border-radius:7px; color:var(--text-onink); padding:11px 14px; font-size:14px; outline:none;}
  .yt-form input:focus{border-color:var(--amber);}
  .yt-meta-card{display:flex; gap:14px; margin-top:18px; background:var(--ink-900); border:1px solid var(--line-onink); border-radius:10px; padding:14px; align-items:center;}
  .yt-meta-card img{width:88px; border-radius:6px; flex-shrink:0;}
  .yt-meta-card .t{font-weight:600; font-size:15px; margin:0 0 3px;}
  .yt-meta-card .a{font-size:12.5px; color:var(--text-onink-dim); margin:0;}
  .field-row{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}
  .field-col{flex:1; min-width:150px;}
  .field-col label{font-family:var(--font-mono); font-size:10..5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-onink-dim); display:block; margin-bottom:6px;}
  .field-col select, .field-col input{width:100%; background:var(--ink-900); border:1px solid var(--line-onink); border-radius:7px; color:var(--text-onink); padding:9px 11px; font-size:13.5px; outline:none;}
  .disclosure{font-size:12px; color:var(--text-onink-dim); background:rgba(226,165,60,0.06); border-left:2px solid var(--amber); padding:10px 13px; border-radius:0 6px 6px 0; margin-top:16px; line-height:1.55;}
  .blueprint{margin-top:24px;}
  .blueprint-section{margin-bottom:20px;}
  .blueprint-section h4{font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--amber); margin:0 0 10px;}
  .structure-chain{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .structure-step{background:var(--ink-900); border:1px solid var(--line-onink); border-radius:7px; padding:7px 13px; font-size:13px; font-family:var(--font-mono);}
  .structure-arrow{color:var(--text-onink-dim); font-size:13px;}
  .prompt-list{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:9px;}
  .prompt-list li{background:var(--ink-900); border:1px solid var(--line-onink); border-radius:8px; padding:11px 14px; font-size:14px; line-height:1.5;}
  .audio-panel{margin-top:20px;}
  .audio-panel h3{margin:0 0 4px;}
  .audio-drop{border:1px dashed rgba(38,42,61,0.28); border-radius:8px; padding:18px; margin-top:14px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .audio-drop input[type=file]{display:none;}
  .audio-file-label{font-family:var(--font-mono); font-size:12px; color:var(--text-onpaper-dim);}
  .audio-player{width:100%; margin-top:12px;}
  .audio-note{font-size:12px; color:var(--text-onpaper-dim); margin-top:10px; line-height:1.55; border-left:2px solid var(--amber-dim); padding-left:11px;}
  .genre-badge{font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.03em; background:rgba(76,148,132,0.14); color:#2f6d5f; padding:4px 11px; border-radius:20px; display:inline-flex; width:fit-content; font-weight:500; margin-top:10px;}
  .mood-tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .mood-tag{font-family:var(--font-mono); font-size:10.5px; background:var(--paper-dim); color:var(--text-onpaper-dim); padding:3px 9px; border-radius:20px;}
  .ai-summary-text{font-size:14.5px; line-height:1.6; margin-top:12px;}
  .opener-lines{display:flex; flex-direction:column; gap:8px;}
  .opener-line{font-family:var(--font-display); font-size:16px; font-style:italic; padding:9px 4px; border-bottom:1px solid var(--line-onink); color:var(--paper);}
  .word-hero{background:var(--paper); color:var(--text-onpaper); border-radius:12px; padding:34px 30px; margin-top:20px; position:relative; overflow:hidden;}
  .word-hero .eyebrow-onpaper{font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--amber-dim); margin:0 0 10px;}
  .word-hero .word{font-family:var(--font-display); font-size:46px; font-weight:600; margin:0; letter-spacing:-0.01em;}
  .word-hero .ipa{font-family:var(--font-mono); font-size:13px; color:var(--text-onpaper-dim); margin:4px 0 18px;}
  .word-hero .def{font-size:16px; line-height:1.6; max-width:60ch; margin:0 0 14px;}
  .word-hero .example{font-family:var(--font-display); font-style:italic; font-size:16px; color:var(--text-onpaper-dim); border-left:2px solid var(--amber-dim); padding-left:14px; margin:0;}
  .word-actions{display:flex; gap:8px; margin-top:20px;}
  .fav-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; margin-top:16px;}
  .fav-card{background:var(--ink-900); border:1px solid var(--line-onink); border-radius:8px; padding:12px 14px;}
  .fav-card .w{font-family:var(--font-display); font-weight:600; font-size:15px; margin:0 0 3px;}
  .fav-card .d{font-size:12px; color:var(--text-onink-dim); margin:0; line-height:1.4;}
  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink-850); border:1px solid var(--amber); color:var(--text-onink); padding:10px 18px; border-radius:8px; font-size:13px; z-index:50; opacity:0; pointer-events:none; transition:opacity .2s ease;}
  .toast.show{opacity:1;}
  @media (max-width:640px){.main{padding:24px 16px 40px;} h1{font-size:26px;} .word-hero .word{font-size:34px;}}
  /* Audio & AI analysis */
  .audio-panel{margin-top:20px;}
  .audio-panel h3{margin:0 0 4px;}
  .audio-drop{border:1px dashed rgba(38,42,61,0.28); border-radius:8px; padding:18px; margin-top:14px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .audio-drop input[type=file]{display:none;}
  .audio-file-label{font-family:var(--font-mono); font-size:12px; color:var(--text-onpaper-dim);}
  .audio-player{width:100%; margin-top:12px;}
  .audio-note{font-size:12px; color:var(--text-onpaper-dim); margin-top:10px; line-height:1.55; border-left:2px solid var(--amber-dim); padding-left:11px;}
  .genre-badge{font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.03em; background:rgba(76,148,132,0.14); color:#2f6d5f; padding:4px 11px; border-radius:20px; display:inline-flex; width:fit-content; font-weight:500; margin-top:10px;}
  .mood-tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .mood-tag{font-family:var(--font-mono); font-size:10.5px; background:var(--paper-dim); color:var(--text-onpaper-dim); padding:3px 9px; border-radius:20px;}
  .ai-summary-text{font-size:14.5px; line-height:1.6; margin-top:12px;}

  /* ===================== Reimzeit 2.0 — visual overhaul ===================== */
  @keyframes bgdrift{0%{background-position:0% 0%, 100% 100%;} 100%{background-position:100% 100%, 0% 0%;}}
  body{
    background:
      radial-gradient(circle at 12% 8%, rgba(226,165,60,0.10), transparent 42%),
      radial-gradient(circle at 88% 92%, rgba(76,148,132,0.10), transparent 42%),
      var(--ink-950);
    background-size:200% 200%;
    animation:bgdrift 26s ease-in-out infinite alternate;
  }
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:rgba(226,165,60,0.25); border-radius:20px;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(226,165,60,0.45);}

  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .main{animation:fadein .32s ease both;}

  .spine{background:linear-gradient(180deg, var(--ink-900), var(--ink-950)); box-shadow:1px 0 0 rgba(226,165,60,0.05);}
  .spine-logo svg{filter:drop-shadow(0 0 10px rgba(226,165,60,0.45));}
  .spine-tab{position:relative; border-radius:0 8px 8px 0;}
  .spine-tab.active{box-shadow:inset 0 0 18px rgba(226,165,60,0.08);}
  .spine-tab.active svg{filter:drop-shadow(0 0 5px rgba(226,165,60,0.6));}
  .spine-tab:not(.active):hover svg{transform:scale(1.06); transition:transform .15s ease;}

  h1{background:linear-gradient(90deg, var(--text-onink) 30%, var(--amber) 90%); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .paper h1, .paper h2{background:none; -webkit-background-clip:initial; color:var(--text-onpaper);}

  .btn{position:relative; overflow:hidden;}
  .btn-amber{background:linear-gradient(135deg, #f0b559, var(--amber) 55%, var(--rust)); border-color:transparent; box-shadow:0 3px 14px rgba(226,165,60,0.28); transition:all .18s ease;}
  .btn-amber:hover{transform:translateY(-1px); box-shadow:0 6px 20px rgba(226,165,60,0.4); background:linear-gradient(135deg, #f6c470, #eeb556 55%, var(--rust));}
  .btn-amber:active{transform:translateY(0);}
  .btn:not(.btn-amber):hover{transform:translateY(-1px);}

  .song-card{transition:border-color .18s ease, transform .18s ease, box-shadow .18s ease; position:relative;}
  .song-card::before{content:"";position:absolute; inset:0; border-radius:9px; padding:1px; background:linear-gradient(135deg, rgba(226,165,60,0), rgba(226,165,60,0)); -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; transition:background .18s ease;}
  .song-card:hover{transform:translateY(-3px); box-shadow:0 10px 26px rgba(0,0,0,0.35);}
  .song-card:hover::before{background:linear-gradient(135deg, var(--amber), var(--rust));}

  .chip{transition:all .15s ease;}
  .chip:not(.active):hover{border-color:var(--amber); color:var(--amber);}
  .chip.active{box-shadow:0 3px 10px rgba(226,165,60,0.3);}

  .word-hero{background:linear-gradient(155deg, var(--paper), var(--paper-dim)); box-shadow:0 14px 34px rgba(0,0,0,0.28);}
  .word-hero::after{content:"”"; position:absolute; top:-10px; right:18px; font-family:var(--font-display); font-size:150px; color:rgba(38,42,61,0.05); line-height:1;}

  .empty-state{transition:border-color .2s ease;}
  .empty-state:hover{border-color:rgba(226,165,60,0.4);}

  .toast{box-shadow:0 8px 24px rgba(0,0,0,0.4);}

  /* Auth screen */
  .auth-screen{position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; padding:24px;
    background:
      radial-gradient(circle at 18% 20%, rgba(226,165,60,0.14), transparent 45%),
      radial-gradient(circle at 82% 80%, rgba(76,148,132,0.14), transparent 45%),
      var(--ink-950);
  }

  function normTxt(t){ return (t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s]/gi," "); }

    {w:"Gänsehaut", ipa:"[ˈɡɛnzəhaʊ̯t]", def:"Die kleinen Erhebungen auf der Haut bei Kälte oder starker Emotion.", ex:"Deine Stimme, und ich krieg Gänsehaut mitten im Sommer."},
    {w:"Herzenswunsch", ipa:"[ˈhɛʁtsn̩svʊnʃ]", def:"Ein tief empfundener, innigster Wunsch.", ex:"Mein Herzenswunsch schläft leise unterm Kopfkissen."},
    {w:"Klangfarbe", ipa:"[ˈklaŋfaʁbə]", def:"Die charakteristische Färbung eines Tons oder einer Stimme, die sie unverwechselbar macht.", ex:"Deine Klangfarbe erkenn ich unter tausend Stimmen raus."},
    {w:"Windstille", ipa:"[ˈvɪntʃtɪlə]", def:"Völlige Abwesenheit von Wind — bildlich: ein Moment der Ruhe vor oder nach etwas Großem.", ex:"Zwischen uns liegt Windstille, bevor der nächste Sturm kommt."},
    {w:"Herzblut", ipa:"[ˈhɛʁtsbluːt]", def:"Die eigene tiefste Hingabe, oft für ein Werk oder eine Sache.", ex:"Das ist kein Song, das ist mein Herzblut auf Papier."},
    {w:"Morgenrot", ipa:"[ˈmɔʁɡn̩ʁoːt]", def:"Die rötliche Färbung des Himmels beim Sonnenaufgang.", ex:"Wir haben die Nacht durchgeredet bis ins Morgenrot."},
    {w:"Seelenverwandt", ipa:"[ˈzeːlənfɛɐ̯vant]", def:"Jemand, dessen Wesen dem eigenen zutiefst ähnlich oder vertraut ist.", ex:"Seelenverwandt, das Wort ist zu klein für das, was wir sind."},
    {w:"Lebenslied", ipa:"[ˈleːbn̩sliːt]", def:"Ein Lied, das den Verlauf oder die Essenz eines Lebens einfängt.", ex:"Jede Strophe hier ist ein Vers aus meinem Lebenslied."},
    {w:"Trugbild", ipa:"[ˈtʁuːkbɪlt]", def:"Eine täuschende, nicht der Wirklichkeit entsprechende Erscheinung.", ex:"War alles nur ein Trugbild, oder warst wirklich du im Raum?"},
    {w:"Herzensbrecher", ipa:"[ˈhɛʁtsn̩sbʁɛçɐ]", def:"Jemand, der (bewusst oder unbewusst) Herzen bricht.", ex:"Sie nannten ihn Herzensbrecher, bevor er wusste, was Liebe ist."},
    {w:"Flimmerlicht", ipa:"[ˈflɪmɐlɪçt]", def:"Unruhig zitterndes, unstetes Licht.", ex:"Im Flimmerlicht der Bar sah alles ehrlicher aus."},
    {w:"Traumtänzer", ipa:"[ˈtʁaʊ̯mtɛntsɐ]", def:"Jemand, der realitätsfern, verträumt durchs Leben geht.", ex:"Nennt mich Traumtänzer, ich tanz trotzdem weiter."},
    {w:"Herzrasen", ipa:"[ˈhɛʁtsʁaːzn̩]", def:"Beschleunigter Herzschlag, oft durch Aufregung oder Angst ausgelöst.", ex:"Herzrasen, sobald dein Name auf dem Display steht."},
    {w:"Nachtgedanken", ipa:"[ˈnaxtɡədaŋkn̩]", def:"Gedanken, die einen nachts wach halten, oft schwerer als am Tag.", ex:"Nachtgedanken sind lauter als jeder Verstärker."},
    {w:"Silberstreif", ipa:"[ˈzɪlbɐʃtʁaɪ̯f]", def:"Ein Hoffnungsschimmer, meist als 'Silberstreif am Horizont'.", ex:"Ein Silberstreif reicht, um weiterzuschreiben."}
  ];
  function dayIndex(){ const now=new Date(); const start=new Date(now.getFullYear(),0,0); const diff=now-start; return Math.floor(diff/86400000)%WORDS.length; }

  /* ---------- state ---------- */
  const state = {
    tab:"dashboard", songs:[], favWords:[], activeSongId:null, statusFilter:"alle",
    rhymeQuery:"", rhymeResult:null, rhymeLoading:false, rhymeError:null,
    ytUrl:"", ytMeta:null, ytLoading:false, ytError:null,
    genre:"Pop", mood:"melancholisch", blueprint:null, blueprintLoading:false, blueprintError:null,
    wordIdx:dayIndex(), loaded:false,
    audioUploading:false, transcribing:false, transcribeError:null,
    analysisLoading:false, analysisError:null,
    continueLoading:false, continueError:null, continueSuggestions:null,
    feedbackLoading:false, feedbackError:null, feedback:null,
    groqKeyInput:"", groqTestState:null
  };
  const STATUS_OPTS=["Idee","Entwurf","Fertig","Aufgenommen"];
  function statusClass(s){ return {Idee:"badge-idee",Entwurf:"badge-entwurf",Fertig:"badge-fertig",Aufgenommen:"badge-aufgenommen"}[s]||"badge-idee"; }
  function uid(){ return "s"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function fmtDate(ts){ const d=new Date(ts); return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"2-digit"}); }
  function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  let toastTimer=null;
  function showToast(msg){ const t=document.getElementById("toast"); if(!t) return; t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2600); }

  const ICONS = {
    dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
    write:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
    inspire:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="6" width="20" height="12" rx="3"/><path d="M10 9.5v5l5-2.5-5-2.5Z" fill="currentColor" stroke="none"/></svg>',
    word:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2.5Z"/><path d="M4 19.5A2 2 0 0 1 6 18h13"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>',
    trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/></svg>',
    back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18l-6-6 6-6"/></svg>',
    heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20.8 8.6c0 5-8.8 10.4-8.8 10.4S3.2 13.6 3.2 8.6a4.9 4.9 0 0 1 8.8-2.9 4.9 4.9 0 0 1 8.8 2.9Z"/></svg>',
    shuffle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4h4l7 16h4M4 20h4l3.5-8"/><path d="M17 4h3v3M20 4l-4.5 4.5M17 20h3v-3M20 20l-4.5-4.5"/></svg>',
    mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/></svg>',
    logout:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>',
    gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.11.36.31.68.6.92"/></svg>',
    sparkle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>'
  };

  function LOGO_SVG(size){
    return `<svg viewBox="0 0 64 64" width="${size}" height="${size}" fill="none" style="filter:drop-shadow(0 0 10px rgba(226,165,60,0.45))">
      <defs>
        <linearGradient id="logoGrad" x1="0" y1="0" x2="64" y2="64">
          <stop offset="0%" stop-color="#f0b559"/>
          <stop offset="55%" stop-color="#c15c47"/>
          <stop offset="100%" stop-color="#4c9484"/>
        </linearGradient>
      </defs>
      <circle cx="32" cy="32" r="29" fill="none" stroke="url(#logoGrad)" stroke-width="1.4" opacity="0.35"/>
      <path d="M22 47V21c0-6 6-9 12-7 6 2 7 10 1 13-4 2-9 1-11-2" stroke="url(#logoGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M32 27l10 20" stroke="url(#logoGrad)" stroke-width="5" stroke-linecap="round"/>
      <circle cx="48" cy="18" r="3" fill="#f0b559"/>
    </svg>`;
  }

  const root = document.getElementById("root");
  function render(){ root.innerHTML = spineHTML() + mainHTML() + '<div class="toast" id="toast"></div>'; bindEvents(); }

  function spineHTML(){
    const tabs=[{id:"dashboard",label:"Songs",icon:"dashboard"},{id:"write",label:"Schreiben",icon:"write"},{id:"inspire",label:"Inspire",icon:"inspire"},{id:"word",label:"Wort",icon:"word"},{id:"settings",label:"KI",icon:"gear"}];
    return `<nav class="spine"><div class="spine-logo" style="font-size:0;width:45px;height:45px;">${LOGO_SVG(45)}</div><div class="spine-tabs">${tabs.map(t=>`<button class="spine-tab ${state.tab===t.id?"active":""}" data-tab="${t.id}">${ICONS[t.icon]}<span>${t.label}</span></button>`).join("")}</div><div class="spine-foot">Reimzeit${currentUser && currentUser.email ? `<div class="user-chip">${escapeHtml(currentUser.email)}</div>` : ""}<button class="logout-btn" data-action="logout" title="Abmelden">${ICONS.logout}</button></div></nav>`;
  }
  function mainHTML(){
    if(state.tab==="dashboard") return dashboardHTML();
    if(state.tab==="write") return writeHTML();
    if(state.tab==="inspire") return inspireHTML();
    if(state.tab==="word") return wordHTML();
    if(state.tab==="settings") return settingsHTML();
    return "";
  }

  function dashboardHTML(){
    const filtered=state.statusFilter==="alle"?state.songs:state.songs.filter(s=>s.status===state.statusFilter);
    const sorted=[...filtered].sort((a,b)=>b.updatedAt-a.updatedAt);
    return `
    <main class="main">
      <div class="page-head" style="display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:14px;">
        <div>
          <p class="eyebrow">Deine Songs</p>
          <h1>Übersicht</h1>
          <p class="subtext">${state.songs.length} Song${state.songs.length===1?"":"s"} — gespeichert in deiner eigenen Cloud, bleibt für immer erhalten.</p>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn btn-amber" data-action="new-song">${ICONS.plus} Neuer Song</button>
          <button class="btn" data-action="export-project">Exportieren</button>
          <button class="btn" data-action="import-project">Importieren</button>
          <input type="file" id="import-project-input" accept="application/json" hidden>
        </div>
      </div>
      <div class="filter-row">
        <button class="chip ${state.statusFilter==="alle"?"active":""}" data-filter="alle">Alle</button>
        ${STATUS_OPTS.map(s=>`<button class="chip ${state.statusFilter===s?"active":""}" data-filter="${s}">${s}</button>`).join("")}
      </div>
      ${sorted.length===0 ? `
        <div class="empty-state"><h3>Noch kein Song da</h3><p>Leg deinen ersten Song an — Titel reicht erstmal.</p></div>
      ` : `
        <div class="song-grid">
          ${sorted.map(s=>`
            <div class="song-card" data-open="${s.id}">
              <span class="badge ${statusClass(s.status)}">${s.status}</span>
              ${s.genre ? `<span class="badge" style="background:rgba(76,148,132,0.16); color:#7fd1bc;">${escapeHtml(s.genre)}</span>` : ""}
              ${s.audioUrl ? `<span class="badge" style="background:rgba(226,165,60,0.16); color:#e2a53c;">Audio</span>` : ""}
              <p class="song-card-title">${escapeHtml(s.title||"Ohne Titel")}</p>
              <p class="song-card-snippet">${escapeHtml((s.lyrics||"").slice(0,120))||"Noch keine Zeilen geschrieben."}</p>
              <div class="song-card-meta"><span>${fmtDate(s.updatedAt)}</span><span>${(s.lyrics||"").split(/\s+/).filter(Boolean).length} Wörter</span></div>
            </div>`).join("")}
        </div>
      `}
    </main>`;
  }

  function writeHTML(){
    const song = state.songs.find(s=>s.id===state.activeSongId);
    if(!song){
      return `
      <main class="main">
        <div class="page-head">
          <p class="eyebrow">Schreiben</p><h1>Wähl einen Song</h1>
          <p class="subtext">Öffne einen Song aus der Übersicht oder leg einen neuen an, um loszuschreiben.</p>
        </div>
        <button class="btn btn-amber" data-action="new-song">${ICONS.plus} Neuer Song</button>
        <div style="margin-top:24px;">${state.songs.length ? songPickListHTML() : ""}</div>
      </main>`;
    }
    const words=(song.lyrics||"").split(/\s+/).filter(Boolean).length;
    return `
    <main class="main">
      <div class="page-head"><button class="btn btn-sm" data-action="back-dashboard" style="margin-bottom:14px;">${ICONS.back} Übersicht</button></div>
      <div class="editor-grid">
        <div class="paper">
          <input class="title-input" id="title-input" value="${escapeHtml(song.title)}" placeholder="Songtitel">
          <div class="status-row">
            <select class="status-select" id="status-select">${STATUS_OPTS.map(s=>`<option value="${s}" ${s===song.status?"selected":""}>${s}</option>`).join("")}</select>
            <button class="btn-ghost-onpaper" data-action="delete-song" title="Song löschen">${ICONS.trash}</button>
          </div>
          <div class="lyric-area-wrap"><textarea class="lyric-area" id="lyric-area" placeholder="Strophe 1...">${escapeHtml(song.lyrics)}</textarea></div>
          <p class="word-count">${words} Wörter</p>

          <div class="audio-panel">
            <h3>Audio & KI-Analyse</h3>
            <p class="subtext">Song als MP3, WAV oder FLAC hochladen — wird dauerhaft in deiner Cloud gespeichert (nicht im Browser).</p>
            <div class="audio-drop">
              <label class="btn btn-onpaper btn-sm" for="audio-file-input">${ICONS.plus} Datei wählen</label>
              <input type="file" id="audio-file-input" accept=".mp3,.wav,.flac,audio/*">
              <span class="audio-file-label" id="audio-file-label">${state.audioUploading ? "Lädt hoch…" : (song.audioName ? escapeHtml(song.audioName) : "Keine Datei ausgewählt")}</span>
            </div>
            ${song.audioUrl ? `<audio class="audio-player" controls crossorigin="anonymous" src="${song.audioUrl}"></audio><canvas id="audio-visualizer" width="700" height="160" style="width:100%; margin-top:12px; border-radius:8px; background:#14161f;"></canvas>` : ""}

            ${song.audioUrl ? `
            <div style="margin-top:16px;">
              <button class="btn btn-onpaper btn-sm" data-action="transcribe-audio" ${state.transcribing?"disabled":""}>${ICONS.mic} ${state.transcribing ? "Transkribiere…" : "Text automatisch transkribieren"}</button>
              ${state.transcribeError ? `<p class="error-text" style="margin-top:8px;">${escapeHtml(state.transcribeError)}</p>` : ""}
            </div>` : ""}

            <div style="margin-top:18px; border-top:1px solid rgba(38,42,61,0.12); padding-top:16px;">
              <button class="btn btn-onpaper btn-sm" data-action="analyze-song" ${state.analysisLoading?"disabled":""}>${state.analysisLoading ? "Analysiere…" : "Genre & Zusammenfassung generieren"}</button>
              ${state.analysisError ? `<p class="error-text" style="margin-top:8px;">${escapeHtml(state.analysisError)}</p>` : ""}
              ${song.genre ? `<div><span class="genre-badge">${escapeHtml(song.genre)}</span></div>` : ""}
              ${(song.moodTags && song.moodTags.length) ? `<div class="mood-tags">${song.moodTags.map(t=>`<span class="mood-tag">${escapeHtml(t)}</span>`).join("")}</div>` : ""}
              ${song.summary ? `<p class="ai-summary-text">${escapeHtml(song.summary)}</p>` : ""}
            </div>
          </div>
        </div>

        <div class="side-panel">
          <h3>Reimfinder</h3>
          <p class="subtext">Gib ein Wort ein, ich such passende Reime.</p>
          <div class="rhyme-input-row">
            <input id="rhyme-input" placeholder="z.B. Herz" value="${escapeHtml(state.rhymeQuery)}">
            <button class="btn btn-sm btn-amber" data-action="find-rhymes">Suchen</button>
          </div>
          ${rhymeResultsHTML()}

          <h3 style="margin-top:26px;">${ICONS.sparkle} Weiterschreiben</h3>
          <p class="subtext">Die KI schlägt 3 Varianten vor, wie dein Text weitergehen könnte.</p>
          <button class="btn btn-sm" data-action="continue-writing" ${state.continueLoading?"disabled":""}>${state.continueLoading ? "Denkt nach…" : "Vorschläge holen"}</button>
          ${continueWritingHTML()}

          <h3 style="margin-top:26px;">KI-Feedback</h3>
          <p class="subtext">Ehrliches Feedback zu Reim, Bildsprache und Klischees.</p>
          <button class="btn btn-sm" data-action="get-feedback" ${state.feedbackLoading?"disabled":""}>${state.feedbackLoading ? "Analysiert…" : "Feedback holen"}</button>
          ${feedbackHTML()}
        </div>
      </div>
    </main>`;
  }

  function continueWritingHTML(){
    if(state.continueLoading) return `<div class="loading-line" style="margin-top:10px;"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
    if(state.continueError) return `<p class="error-text" style="margin-top:10px;">${escapeHtml(state.continueError)}</p>`;
    if(!state.continueSuggestions) return "";
    return `<div style="margin-top:10px; display:flex; flex-direction:column; gap:8px;">${state.continueSuggestions.map((s,i)=>`
      <div class="empty-state" style="padding:12px; text-align:left;">
        <p style="white-space:pre-wrap; font-size:13.5px; line-height:1.6; margin:0 0 8px;">${escapeHtml(s)}</p>
        <button class="btn btn-sm" data-insert-continuation="${i}">Übernehmen</button>
      </div>`).join("")}</div>`;
  }

  function feedbackHTML(){
    if(state.feedbackLoading) return `<div class="loading-line" style="margin-top:10px;"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
    if(state.feedbackError) return `<p class="error-text" style="margin-top:10px;">${escapeHtml(state.feedbackError)}</p>`;
    if(!state.feedback) return "";
    const f=state.feedback;
    return `<div style="margin-top:10px;">
      ${(f.staerken&&f.staerken.length) ? `<p class="rhyme-group-label">Stärken</p><ul class="prompt-list">${f.staerken.map(s=>`<li>${escapeHtml(s)}</li>`).join("")}</ul>` : ""}
      ${(f.verbesserungen&&f.verbesserungen.length) ? `<p class="rhyme-group-label">Verbesserungen</p><ul class="prompt-list">${f.verbesserungen.map(s=>`<li>${escapeHtml(s)}</li>`).join("")}</ul>` : ""}
      ${f.gesamteindruck ? `<p class="ai-summary-text">${escapeHtml(f.gesamteindruck)}</p>` : ""}
    </div>`;
  }

  function songPickListHTML(){
    return `<div class="song-grid">${state.songs.map(s=>`
      <div class="song-card" data-open="${s.id}">
        <span class="badge ${statusClass(s.status)}">${s.status}</span>
        <p class="song-card-title">${escapeHtml(s.title||"Ohne Titel")}</p>
        <p class="song-card-snippet">${escapeHtml((s.lyrics||"").slice(0,100))}</p>
      </div>`).join("")}</div>`;
  }

  function rhymeResultsHTML(){
    if(state.rhymeLoading) return `<div class="loading-line"><span class="dot"></span><span class="dot"></span><span class="dot"></span> Reime werden gesucht…</div>`;
    if(state.rhymeError) return `<p class="error-text">${escapeHtml(state.rhymeError)}</p>`;
    if(!state.rhymeResult) return "";
    const r=state.rhymeResult;
    const groups=[{label:"Perfekte Reime", items:r.perfekte||[]},{label:"Unreine Reime", items:r.unreine||[]}];
    return groups.map(g => g.items.length ? `
      <div class="rhyme-group-label">${g.label}</div>
      <div class="rhyme-chips">${g.items.map(w=>`<button class="rhyme-chip" data-insert-word="${escapeHtml(w)}">${escapeHtml(w)}</button>`).join("")}</div>
    ` : "").join("");
  }

  function inspireHTML(){
    return `
    <main class="main">
      <div class="page-head">
        <p class="eyebrow">Inspiration</p><h1>Song-Bauplan aus einem Vorbild</h1>
        <p class="subtext">Füg einen YouTube-Link ein, wähl Genre und Stimmung — ich bau dir eine originelle Struktur mit Reimschema und Einstiegszeilen im ähnlichen Vibe.</p>
      </div>
      <div class="yt-form">
        <input id="yt-url" placeholder="https://youtube.com/watch?v=..." value="${escapeHtml(state.ytUrl)}">
        <button class="btn btn-sm" data-action="fetch-yt">Song laden</button>
      </div>
      ${state.ytLoading ? `<div class="loading-line" style="margin-top:14px;"><span class="dot"></span><span class="dot"></span><span class="dot"></span> Lade Video-Infos…</div>` : ""}
      ${state.ytError ? `<p class="error-text" style="margin-top:12px;">${escapeHtml(state.ytError)}</p>` : ""}
      ${state.ytMeta ? `<div class="yt-meta-card"><img src="${state.ytMeta.thumb}" alt=""><div><p class="t">${escapeHtml(state.ytMeta.title)}</p><p class="a">${escapeHtml(state.ytMeta.author)}</p></div></div>` : ""}
      <div class="field-row">
        <div class="field-col"><label>Genre</label><select id="genre-select">${["Pop","Rock","Hip-Hop","Ballade","Folk","Electro","R&B"].map(g=>`<option ${g===state.genre?"selected":""}>${g}</option>`).join("")}</select></div>
        <div class="field-col"><label>Stimmung</label><select id="mood-select">${["melancholisch","euphorisch","wütend","verträumt","hoffnungsvoll","nostalgisch","trotzig"].map(m=>`<option ${m===state.mood?"selected":""}>${m}</option>`).join("")}</select></div>
      </div>
      <div class="disclosure">Hinweis: Ich kann das Video nicht tatsächlich anhören. Der Bauplan basiert auf Titel, Genre und Stimmung — als Inspirationshilfe, nicht als Kopie des Originalsongs.</div>
      <button class="btn btn-amber" data-action="gen-blueprint" style="margin-top:18px;" ${state.blueprintLoading?"disabled":""}>${state.blueprintLoading ? "Baue Bauplan…" : "Bauplan generieren"}</button>
      ${state.blueprintError ? `<p class="error-text" style="margin-top:10px;">${escapeHtml(state.blueprintError)}</p>` : ""}
      ${state.blueprint ? blueprintHTML(state.blueprint) : ""}
    </main>`;
  }

  function blueprintHTML(bp){
    return `
    <div class="blueprint paper">
      <div class="blueprint-section"><h4>Struktur</h4><div class="structure-chain">${(bp.structure||[]).map((s,i)=>`<span class="structure-step">${escapeHtml(s)}</span>${i<bp.structure.length-1?'<span class="structure-arrow">→</span>':""}`).join("")}</div></div>
      <div class="blueprint-section"><h4>Reimschema</h4><p style="font-family:var(--font-mono); font-size:14px;">${escapeHtml(bp.rhymeScheme||"")}</p></div>
      <div class="blueprint-section"><h4>Schreib-Impulse</h4><ul class="prompt-list">${(bp.prompts||[]).map(p=>`<li>${escapeHtml(p)}</li>`).join("")}</ul></div>
      <div class="blueprint-section"><h4>Mögliche Einstiegszeilen</h4><div class="opener-lines" style="color:var(--text-onpaper);">${(bp.openingLines||[]).map(l=>`<div class="opener-line" style="color:var(--text-onpaper);">${escapeHtml(l)}</div>`).join("")}</div></div>
      <button class="btn btn-onpaper btn-sm" data-action="save-blueprint-as-song">${ICONS.plus} Als neuen Song speichern</button>
    </div>`;
  }

  function settingsHTML(){
    const key=getGroqKey();
    const masked = key ? key.slice(0,4)+"••••••••••••"+key.slice(-4) : "";
    return `
    <main class="main">
      <div class="page-head">
        <p class="eyebrow">Einstellungen</p><h1>KI-Anbindung (Groq)</h1>
        <p class="subtext">Reimzeit nutzt Groq für Reime, Transkription, Songanalyse, Bauplan-Ideen, Weiterschreiben und Feedback. Dein Key wird ausschließlich lokal in diesem Browser gespeichert — nie in der Cloud, nie mit anderen Nutzer:innen geteilt.</p>
      </div>
      <div class="paper" style="max-width:560px;">
        ${key ? `
          <p class="rhyme-group-label">Aktueller Key</p>
          <p style="font-family:var(--font-mono); font-size:14px; margin:0 0 16px;">${masked}</p>
          <button class="btn btn-onpaper btn-sm" data-action="remove-groq-key">Key entfernen</button>
        ` : `
          <div class="auth-field">
            <label for="groq-key-input">Groq API Key</label>
            <input type="password" id="groq-key-input" placeholder="gsk_..." value="${escapeHtml(state.groqKeyInput)}" style="width:100%; background:var(--paper-dim); border:1px solid var(--paper-line); border-radius:8px; padding:11px 13px; font-size:14px; color:var(--text-onpaper);">
          </div>
          <button class="btn btn-amber btn-sm" data-action="save-groq-key">Speichern</button>
        `}
        ${state.groqTestState==="ok" ? `<p style="color:var(--teal); font-size:13px; margin-top:12px;">${ICONS.check} Verbindung funktioniert.</p>` : ""}
        ${state.groqTestState==="fail" ? `<p class="error-text" style="margin-top:12px;">Verbindung fehlgeschlagen — Key prüfen.</p>` : ""}
        ${key ? `<button class="btn btn-onpaper btn-sm" data-action="test-groq-key" style="margin-top:12px;">Verbindung testen</button>` : ""}
      </div>
      <div class="disclosure" style="max-width:560px; margin-top:20px;">Einen kostenlosen Key gibt's unter <strong>console.groq.com</strong> → API Keys → Create Key. Der Key ist an deinen Groq-Account gebunden — für Kosten/Limits gelten Groqs eigene Konditionen.</div>
    </main>`;
  }

  function wordHTML(){
    const word = WORDS[state.wordIdx];
    const isFav = state.favWords.some(f=>f.w===word.w);
    return `
    <main class="main">
      <div class="page-head">
        <p class="eyebrow">Tägliche Inspiration</p><h1>Wort des Tages</h1>
        <p class="subtext">Ein neues, ungewöhnliches Wort — jeden Tag eins, perfekt für die nächste Zeile.</p>
      </div>
      <div class="word-hero">
        <p class="eyebrow-onpaper">Heute</p>
        <p class="word">${escapeHtml(word.w)}</p>
        <p class="ipa">${escapeHtml(word.ipa)}</p>
        <p class="def">${escapeHtml(word.def)}</p>
        <p class="example">${escapeHtml(word.ex)}</p>
        <div class="word-actions">
          <button class="btn btn-onpaper btn-sm" data-action="toggle-fav-word">${ICONS.heart} ${isFav ? "Gemerkt" : "Merken"}</button>
          <button class="btn btn-onpaper btn-sm" data-action="shuffle-word">${ICONS.shuffle} Anderes Wort</button>
        </div>
      </div>
      ${state.favWords.length ? `
        <p class="rhyme-group-label" style="margin-top:26px;">Gemerkte Wörter</p>
        <div class="fav-grid">${state.favWords.map(f=>`<div class="fav-card"><p class="w">${escapeHtml(f.w)}</p><p class="d">${escapeHtml(f.def)}</p></div>`).join("")}</div>
      ` : ""}
    </main>`;
  }

  function bindEvents(){
    root.querySelectorAll("[data-tab]").forEach(el=>el.addEventListener("click", ()=>{ state.tab=el.dataset.tab; render(); }));

    const logoutBtn = root.querySelector('[data-action="logout"]');
    if(logoutBtn) logoutBtn.addEventListener("click", async ()=>{
      try{ await signOut(auth); }
      catch(e){ console.error("Abmelden fehlgeschlagen", e); showToast("Abmelden fehlgeschlagen — versuch's erneut."); }
    });

    const newSongBtn = root.querySelector('[data-action="new-song"]');
    if(newSongBtn) newSongBtn.addEventListener("click", async ()=>{
      const song={id:uid(), title:"Neuer Song", status:"Idee", lyrics:"", genre:"", summary:"", moodTags:[], audioUrl:"", audioName:"", audioPath:"", createdAt:Date.now(), updatedAt:Date.now()};
      state.songs.push(song); await persistSong(song);
      state.activeSongId=song.id; state.tab="write"; render();
    });

    const exportBtn = root.querySelector('[data-action="export-project"]');
    if(exportBtn) exportBtn.addEventListener("click", exportProject);
    const importBtn = root.querySelector('[data-action="import-project"]');
    const importInput = root.querySelector("#import-project-input");
    if(importBtn && importInput){
      importBtn.addEventListener("click", ()=>importInput.click());
      importInput.addEventListener("change", (e)=>{ const f=e.target.files&&e.target.files[0]; if(f) importProject(f); });
    }

    root.querySelectorAll("[data-filter]").forEach(el=>el.addEventListener("click", ()=>{ state.statusFilter=el.dataset.filter; render(); }));
    root.querySelectorAll("[data-open]").forEach(el=>el.addEventListener("click", ()=>{
      state.activeSongId=el.dataset.open; state.tab="write";
      state.rhymeResult=null; state.rhymeQuery=""; state.rhymeError=null;
      render();
    }));

    const backBtn = root.querySelector('[data-action="back-dashboard"]');
    if(backBtn) backBtn.addEventListener("click", ()=>{ state.tab="dashboard"; render(); });

    const titleInput = root.querySelector("#title-input");
    if(titleInput){
      let t1=null;
      titleInput.addEventListener("input", (e)=>{
        const song=state.songs.find(s=>s.id===state.activeSongId);
        if(song){ song.title=e.target.value; song.updatedAt=Date.now(); clearTimeout(t1); t1=setTimeout(()=>persistSong(song),500); }
      });
    }
    const statusSelect = root.querySelector("#status-select");
    if(statusSelect) statusSelect.addEventListener("change", async (e)=>{
      const song=state.songs.find(s=>s.id===state.activeSongId);
      if(song){ song.status=e.target.value; song.updatedAt=Date.now(); await persistSong(song); render(); }
    });
    const lyricArea = root.querySelector("#lyric-area");
    if(lyricArea){
      let saveTimer=null;
      lyricArea.addEventListener("input", (e)=>{
        const song=state.songs.find(s=>s.id===state.activeSongId);
        if(song){
          song.lyrics=e.target.value; song.updatedAt=Date.now();
          const wc=root.querySelector(".word-count"); if(wc) wc.textContent=e.target.value.split(/\s+/).filter(Boolean).length+" Wörter";
          clearTimeout(saveTimer); saveTimer=setTimeout(()=>persistSong(song),600);
        }
      });
    }
    const delBtn = root.querySelector('[data-action="delete-song"]');
    if(delBtn) delBtn.addEventListener("click", async ()=>{
      const song=state.songs.find(s=>s.id===state.activeSongId);
      state.songs=state.songs.filter(s=>s.id!==state.activeSongId);
      await deleteSongFromCloud(state.activeSongId);
      if(song) await deleteAudioFromCloud(song);
      state.activeSongId=null; state.tab="dashboard"; render();
      showToast("Song gelöscht");
    });

    const rhymeInput = root.querySelector("#rhyme-input");
    if(rhymeInput){
      rhymeInput.addEventListener("input", (e)=>{ state.rhymeQuery=e.target.value; });
      rhymeInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter") findRhymes(); });
    }
    const rhymeBtn = root.querySelector('[data-action="find-rhymes"]');
    if(rhymeBtn) rhymeBtn.addEventListener("click", findRhymes);

    root.querySelectorAll("[data-insert-word]").forEach(el=>el.addEventListener("click", ()=>{
      const ta=root.querySelector("#lyric-area"); if(!ta) return;
      const start=ta.selectionStart, end=ta.selectionEnd, val=ta.value;
      ta.value=val.slice(0,start)+el.dataset.insertWord+val.slice(end);
      ta.dispatchEvent(new Event("input")); ta.focus();
      showToast(el.dataset.insertWord+" eingefügt");
    }));

    const audioInput = root.querySelector("#audio-file-input");
    if(audioInput) audioInput.addEventListener("change", async (e)=>{
      const file=e.target.files && e.target.files[0]; if(!file) return;
      const song=state.songs.find(s=>s.id===state.activeSongId); if(!song) return;
      state.audioUploading=true; render();
      try{
        const url=await uploadAudioToCloud(song.id, file);
        song.audioUrl=url; song.audioName=file.name; song.audioPath="users/"+currentUser.uid+"/songs/"+song.id+"/"+file.name; song.updatedAt=Date.now();
        await persistSong(song); showToast("Audio in der Cloud gespeichert");
      }catch(err){ console.error(err); showToast("Upload fehlgeschlagen — prüf deine Firebase-Konfiguration."); }
      state.audioUploading=false; render();
    });

    const audioEl = root.querySelector(".audio-player");
    if(audioEl){
      audioEl.addEventListener("play", ()=>startAudioAnalysis(audioEl));
      audioEl.addEventListener("pause", stopAudioAnalysis);
      audioEl.addEventListener("ended", stopAudioAnalysis);
    }

    const transcribeBtn = root.querySelector('[data-action="transcribe-audio"]');
    if(transcribeBtn) transcribeBtn.addEventListener("click", transcribeCurrentAudio);

    const analyzeBtn = root.querySelector('[data-action="analyze-song"]');
    if(analyzeBtn) analyzeBtn.addEventListener("click", analyzeSong);

    const ytUrlInput = root.querySelector("#yt-url");
    if(ytUrlInput) ytUrlInput.addEventListener("input", (e)=>{ state.ytUrl=e.target.value; });
    const fetchYtBtn = root.querySelector('[data-action="fetch-yt"]');
    if(fetchYtBtn) fetchYtBtn.addEventListener("click", fetchYoutube);

    const genreSelect = root.querySelector("#genre-select");
    if(genreSelect) genreSelect.addEventListener("change", (e)=>{ state.genre=e.target.value; });
    const moodSelect = root.querySelector("#mood-select");
    if(moodSelect) moodSelect.addEventListener("change", (e)=>{ state.mood=e.target.value; });

    const genBtn = root.querySelector('[data-action="gen-blueprint"]');
    if(genBtn) genBtn.addEventListener("click", generateBlueprint);
    const saveBpBtn = root.querySelector('[data-action="save-blueprint-as-song"]');
    if(saveBpBtn) saveBpBtn.addEventListener("click", saveBlueprintAsSong);

    const continueBtn = root.querySelector('[data-action="continue-writing"]');
    if(continueBtn) continueBtn.addEventListener("click", continueWriting);
    root.querySelectorAll("[data-insert-continuation]").forEach(el=>el.addEventListener("click", ()=>{
      const idx=Number(el.dataset.insertContinuation);
      const suggestion=state.continueSuggestions && state.continueSuggestions[idx];
      const song=state.songs.find(s=>s.id===state.activeSongId);
      if(!suggestion || !song) return;
      song.lyrics=(song.lyrics||"").replace(/\s+$/,"")+"\n"+suggestion; song.updatedAt=Date.now();
      persistSong(song);
      state.continueSuggestions=null; render();
      showToast("Zeilen übernommen");
    }));

    const feedbackBtn = root.querySelector('[data-action="get-feedback"]');
    if(feedbackBtn) feedbackBtn.addEventListener("click", getFeedback);

    const saveKeyBtn = root.querySelector('[data-action="save-groq-key"]');
    if(saveKeyBtn) saveKeyBtn.addEventListener("click", ()=>{
      const input=root.querySelector("#groq-key-input");
      const val=input ? input.value.trim() : "";
      if(!val){ showToast("Bitte einen Key eintragen"); return; }
      setGroqKey(val);
      state.groqKeyInput=""; state.groqTestState=null; render();
      showToast("Key gespeichert");
    });
    const removeKeyBtn = root.querySelector('[data-action="remove-groq-key"]');
    if(removeKeyBtn) removeKeyBtn.addEventListener("click", ()=>{
      setGroqKey(""); state.groqTestState=null; render();
      showToast("Key entfernt");
    });
    const testKeyBtn = root.querySelector('[data-action="test-groq-key"]');
    if(testKeyBtn) testKeyBtn.addEventListener("click", async ()=>{
      state.groqTestState="testing"; render();
      try{
        await askGroq("Antworte nur mit dem Wort OK.", "Test");
        state.groqTestState="ok";
      }catch(e){ state.groqTestState="fail"; }
      render();
    });

    const favBtn = root.querySelector('[data-action="toggle-fav-word"]');
    if(favBtn) favBtn.addEventListener("click", toggleFavWord);
    const shuffleBtn = root.querySelector('[data-action="shuffle-word"]');
    if(shuffleBtn) shuffleBtn.addEventListener("click", ()=>{
      let idx; do{ idx=Math.floor(Math.random()*WORDS.length); }while(idx===state.wordIdx && WORDS.length>1);
      state.wordIdx=idx; render();
    });
  }

  async function findRhymes(){
    const q=state.rhymeQuery.trim();
    if(!q){ state.rhymeError="Gib zuerst ein Wort ein."; render(); return; }
    state.rhymeLoading=true; state.rhymeError=null; state.rhymeResult=null; render();
    try{
      const text=await askGroq(
        "Du bist ein Reim-Assistent fuer deutsche Songtexte. Antworte NUR mit JSON, ohne Erklaerung, ohne Markdown-Codeblock. Format exakt: {\"perfekte\": [\"wort1\",\"wort2\"], \"unreine\": [\"wort1\",\"wort2\"]}. Gib bis zu 10 perfekte und 10 unreine (assonante) deutsche Reimwoerter zurueck, die sich fuer Songtexte eignen.",
        "Reimwort: "+q
      );
      state.rhymeResult=parseJsonLoose(text);
    }catch(err){
      const offline=offlineRhymes(q);
      if(offline.length){ state.rhymeResult={perfekte:offline, unreine:[]}; }
      else{ state.rhymeError=groqErrorMessage(err); }
    }
    state.rhymeLoading=false; render();
  }

  async function continueWriting(){
    const song=state.songs.find(s=>s.id===state.activeSongId);
    if(!song) return;
    const lyrics=(song.lyrics||"").trim();
    if(!lyrics){ state.continueError="Schreib zuerst ein paar Zeilen, dann kann ich anknüpfen."; render(); return; }
    state.continueLoading=true; state.continueError=null; state.continueSuggestions=null; render();
    try{
      const text=await askGroq(
        "Du bist ein deutschsprachiger Songwriting-Assistent. Du schreibst NIEMALS existierende, urheberrechtlich geschuetzte Songtexte ab — nur komplett neue, zum bisherigen Text passende Zeilen im gleichen Stil, Reimschema und Tonfall. Antworte NUR mit JSON, ohne Markdown-Codeblock, exakt: {\"vorschlaege\": [\"Vorschlag 1 (2-4 Zeilen, mit \\n getrennt)\", \"Vorschlag 2\", \"Vorschlag 3\"]}",
        "Bisheriger Songtext:\n"+lyrics+"\n\nSchreib 3 unterschiedliche Vorschläge, wie es als naechstes weitergehen koennte."
      );
      const parsed=parseJsonLoose(text);
      state.continueSuggestions=parsed.vorschlaege||[];
    }catch(err){
      console.error(err);
      state.continueError=groqErrorMessage(err);
    }
    state.continueLoading=false; render();
  }

  async function getFeedback(){
    const song=state.songs.find(s=>s.id===state.activeSongId);
    if(!song) return;
    const lyrics=(song.lyrics||"").trim();
    if(!lyrics){ state.feedbackError="Trag zuerst Text ein."; render(); return; }
    state.feedbackLoading=true; state.feedbackError=null; state.feedback=null; render();
    try{
      const text=await askGroq(
        "Du bist ein erfahrener, ehrlicher aber konstruktiver deutscher Songwriting-Coach. Antworte NUR mit JSON, ohne Markdown-Codeblock, exakt: {\"staerken\": [\"2-3 konkrete Staerken\"], \"verbesserungen\": [\"2-4 konkrete, umsetzbare Verbesserungsvorschlaege, z.B. zu Reimschema, Bildsprache, Klischees, Struktur\"], \"gesamteindruck\": \"1-2 Saetze Gesamtfazit\"}",
        "Songtitel: "+(song.title||"Ohne Titel")+"\n\nText:\n"+lyrics
      );
      state.feedback=parseJsonLoose(text);
    }catch(err){
      console.error(err);
      state.feedbackError=groqErrorMessage(err);
    }
    state.feedbackLoading=false; render();
  }

  async function transcribeCurrentAudio(){
    const song=state.songs.find(s=>s.id===state.activeSongId);
    if(!song || !song.audioUrl) return;
    state.transcribing=true; state.transcribeError=null; render();
    try{
      const res=await fetch(song.audioUrl);
      const blob=await res.blob();
      const file=new File([blob], song.audioName||"audio.mp3", {type:blob.type});
      const transcript=await transcribeAudio(file);
      song.lyrics=transcript; song.updatedAt=Date.now();
      await persistSong(song);
      showToast("Text transkribiert — bitte kurz gegenlesen");
    }catch(err){
      console.error(err);
      state.transcribeError=groqErrorMessage(err);
    }
    state.transcribing=false; render();
  }

  async function analyzeSong(){
    const song=state.songs.find(s=>s.id===state.activeSongId);
    if(!song) return;
    const lyrics=(song.lyrics||"").trim();
    if(!lyrics){ state.analysisError="Trag zuerst Text ein (schreiben oder oben transkribieren lassen)."; render(); return; }
    state.analysisLoading=true; state.analysisError=null; render();
    try{
      const text=await askGroq(
        "Du analysierst Songtexte. Antworte NUR mit JSON, ohne Markdown-Codeblock, exakt in diesem Format: {\"genre\": \"eine kurze Genre-Einschaetzung, z.B. Pop-Ballade\", \"moodTags\": [\"3-5 kurze Stimmungs-Schlagworte\"], \"summary\": \"2-4 Saetze auf Deutsch, worum es in dem Song inhaltlich geht\"}.",
        "Songtitel: "+(song.title||"Ohne Titel")+"\n\nText:\n"+lyrics
      );
      const parsed=parseJsonLoose(text);
      song.genre=parsed.genre||""; song.moodTags=parsed.moodTags||[]; song.summary=parsed.summary||"";
    }catch(err){
      console.error(err);
      const fb=localAnalysisFallback(song);
      song.genre=fb.genre; song.moodTags=fb.moodTags; song.summary=fb.summary;
      state.analysisError=groqErrorMessage(err)+" — Schätzung aus lokaler Textanalyse verwendet.";
    }
    song.updatedAt=Date.now();
    await persistSong(song);
    state.analysisLoading=false; render();
  }

  async function fetchYoutube(){
    const url=state.ytUrl.trim();
    if(!url){ state.ytError="Füg zuerst einen YouTube-Link ein."; render(); return; }
    state.ytLoading=true; state.ytError=null; state.ytMeta=null; render();
    try{
      const oembedUrl="https://www.youtube.com/oembed?url="+encodeURIComponent(url)+"&format=json";
      const res=await fetch(oembedUrl);
      if(!res.ok) throw new Error("nicht gefunden");
      const data=await res.json();
      state.ytMeta={title:data.title, author:data.author_name, thumb:data.thumbnail_url};
    }catch(err){
      state.ytError="Konnte die Video-Infos nicht laden. Du kannst trotzdem unten direkt Genre und Stimmung wählen.";
    }
    state.ytLoading=false; render();
  }

  async function generateBlueprint(){
    state.blueprintLoading=true; state.blueprintError=null; state.blueprint=null; render();
    const refInfo=state.ytMeta ? (state.ytMeta.title+" von "+state.ytMeta.author) : "kein Referenzvideo geladen";
    try{
      const text=await askGroq(
        "Du bist ein kreativer Songwriting-Coach. Du hilfst, einen ORIGINELLEN Song-Bauplan zu erstellen, der sich im Vibe an einer Referenz orientiert, OHNE echte Songtexte zu kopieren. Erfinde alles selbst. Antworte NUR mit JSON, ohne Markdown-Codeblock, exakt in diesem Format: {\"structure\": [\"Strophe 1\",\"Refrain\",\"Strophe 2\",\"Refrain\",\"Bridge\",\"Refrain\"], \"rhymeScheme\": \"z.B. ABAB in den Strophen, AABB im Refrain\", \"prompts\": [\"3-5 kurze, konkrete Schreibimpulse auf Deutsch\"], \"openingLines\": [\"3 originelle, deutsche Beispiel-Eroeffnungszeilen, komplett neu erfunden\"]}",
        "Referenz (nur Titel/Interpret als grobe Stimmungs-Inspiration, NICHT den echten Text verwenden): "+refInfo+". Genre: "+state.genre+". Stimmung: "+state.mood+"."
      );
      state.blueprint=parseJsonLoose(text);
    }catch(err){
      state.blueprint=localBlueprintFallback();
      state.blueprintError=groqErrorMessage(err)+" — lokale Vorlage verwendet.";
    }
    state.blueprintLoading=false; render();
  }

  async function saveBlueprintAsSong(){
    if(!state.blueprint) return;
    const lines=["[Struktur: "+(state.blueprint.structure||[]).join(" -> ")+"]","[Reimschema: "+(state.blueprint.rhymeScheme||"")+"]","", ...(state.blueprint.openingLines||[])];
    const song={id:uid(), title:"Neuer Song ("+state.genre+")", status:"Idee", lyrics:lines.join("\n"), genre:"", summary:"", moodTags:[], audioUrl:"", audioName:"", audioPath:"", createdAt:Date.now(), updatedAt:Date.now()};
    state.songs.push(song); await persistSong(song);
    state.activeSongId=song.id; state.tab="write"; render();
    showToast("Als Song gespeichert");
  }

  async function toggleFavWord(){
    const word=WORDS[state.wordIdx];
    const exists=state.favWords.some(f=>f.w===word.w);
    if(exists) state.favWords=state.favWords.filter(f=>f.w!==word.w);
    else state.favWords.unshift({w:word.w, def:word.def});
    await persistFavWords(); render();
  }

  /* ---------- Auth (E-Mail & Passwort) ---------- */
  const authState = { mode:"login", error:null, loading:false };

  function authErrorMessage(err){
    const code = (err && err.code) || "";
    const map = {
      "auth/invalid-email":"Diese E-Mail-Adresse sieht nicht gültig aus.",
      "auth/user-not-found":"Kein Konto mit dieser E-Mail gefunden.",
      "auth/wrong-password":"Falsches Passwort.",
      "auth/invalid-credential":"E-Mail oder Passwort ist falsch.",
      "auth/email-already-in-use":"Für diese E-Mail existiert bereits ein Konto — meld dich stattdessen an.",
      "auth/weak-password":"Das Passwort muss mindestens 6 Zeichen haben.",
      "auth/missing-password":"Bitte gib ein Passwort ein.",
      "auth/too-many-requests":"Zu viele Versuche. Bitte kurz warten und erneut probieren.",
      "auth/network-request-failed":"Keine Verbindung — prüf dein Internet."
    };
    return map[code] || "Etwas ist schiefgelaufen. Bitte versuch es erneut.";
  }

  function authScreenHTML(){
    const isLogin = authState.mode==="login";
    return `
    <div class="auth-screen">
      <div class="auth-box">
        <div class="auth-logo">${LOGO_SVG(52)}</div>
        <h1 class="auth-title" style="background:none;-webkit-background-clip:initial;color:var(--text-onink);">Reimzeit</h1>
        <p class="auth-subtext">${isLogin ? "Melde dich an, um an deinen Songs weiterzuschreiben." : "Leg ein Konto an — deine Songs bleiben privat, nur für dich."}</p>
        <form id="auth-form" autocomplete="on">
          <div class="auth-field">
            <label for="auth-email">E-Mail</label>
            <input type="email" id="auth-email" autocomplete="email" placeholder="du@beispiel.de" required>
          </div>
          <div class="auth-field">
            <label for="auth-password">Passwort</label>
            <input type="password" id="auth-password" autocomplete="${isLogin?"current-password":"new-password"}" placeholder="••••••••" minlength="6" required>
          </div>
          ${isLogin ? `<button type="button" class="auth-forgot" data-action="forgot-password">Passwort vergessen?</button>` : ""}
          <button type="submit" class="btn btn-amber auth-submit" ${authState.loading?"disabled":""}>${authState.loading ? "Bitte warten…" : (isLogin ? "Anmelden" : "Konto erstellen")}</button>
          ${authState.error ? `<p class="auth-error">${escapeHtml(authState.error)}</p>` : ""}
        </form>
        <div class="auth-switch">
          ${isLogin ? "Noch kein Konto?" : "Schon ein Konto?"}
          <button type="button" data-action="switch-auth-mode">${isLogin ? "Registrieren" : "Anmelden"}</button>
        </div>
      </div>
    </div>`;
  }

  function renderAuthScreen(){
    root.innerHTML = authScreenHTML();
    const form = document.getElementById("auth-form");
    if(form) form.addEventListener("submit", async (e)=>{
      e.preventDefault();
      const email = document.getElementById("auth-email").value.trim();
      const password = document.getElementById("auth-password").value;
      authState.error=null; authState.loading=true; renderAuthScreen();
      try{
        if(authState.mode==="login") await signInWithEmailAndPassword(auth, email, password);
        else await createUserWithEmailAndPassword(auth, email, password);
        /* onAuthStateChanged uebernimmt danach den Wechsel zur App */
      }catch(err){
        console.error("Auth-Fehler", err);
        authState.loading=false; authState.error=authErrorMessage(err); renderAuthScreen();
      }
    });
    const switchBtn = document.querySelector('[data-action="switch-auth-mode"]');
    if(switchBtn) switchBtn.addEventListener("click", ()=>{ authState.mode = authState.mode==="login" ? "register" : "login"; authState.error=null; renderAuthScreen(); });
    const forgotBtn = document.querySelector('[data-action="forgot-password"]');
    if(forgotBtn) forgotBtn.addEventListener("click", async ()=>{
      const emailField = document.getElementById("auth-email");
      const email = emailField ? emailField.value.trim() : "";
      if(!email){ authState.error="Trag zuerst deine E-Mail-Adresse ein, dann kann ich dir einen Link schicken."; renderAuthScreen(); return; }
      try{ await sendPasswordResetEmail(auth, email); authState.error=null; alert("Falls ein Konto zu dieser E-Mail existiert, wurde ein Link zum Zurücksetzen verschickt."); }
      catch(err){ console.error(err); authState.error=authErrorMessage(err); renderAuthScreen(); }
    });
  }

  function fatalErrorScreen(msg){
    root.innerHTML = `<div class="auth-screen"><div class="auth-box"><div class="auth-logo">${LOGO_SVG(52)}</div><h1 class="auth-title" style="background:none;-webkit-background-clip:initial;color:var(--text-onink);">Reimzeit</h1><p class="auth-error" style="text-align:center; margin-top:10px;">${escapeHtml(msg)}</p></div></div>`;
  }

  async function init(){
    if(firebaseInitError || !auth){
      fatalErrorScreen("Verbindung zu Firebase konnte nicht hergestellt werden. Prüf die Konfiguration oben im Code und lade die Seite neu.");
      return;
    }
    root.innerHTML=`<div class="auth-screen"><div class="auth-box" style="text-align:center;"><div class="auth-logo">${LOGO_SVG(52)}</div><p class="subtext" style="margin-top:10px;">Lädt…</p></div></div>`;
    onAuthStateChanged(auth, async (user)=>{
      if(user){
        currentUser = user;
        root.innerHTML=`<main class="main"><p class="subtext" style="margin-top:60px;">Lade deine Songs…</p></main>`;
        try{
          state.songs=await loadSongsFromCloud();
          state.favWords=await loadFavWordsFromCloud();
        }catch(error){
          console.error("Firebase-Ladefehler", error);
          state.songs=[];
          state.favWords=[];
        }
        state.loaded=true;
        render();
      }else{
        currentUser = null;
        state.loaded=false; state.songs=[]; state.favWords=[]; state.activeSongId=null;
        renderAuthScreen();
      }
    }, (error)=>{
      console.error("Auth-Zustand konnte nicht geladen werden", error);
      fatalErrorScreen("Anmeldestatus konnte nicht geladen werden. Prüf deine Internetverbindung und lade die Seite neu.");
    });
  }
  init();
})();
</script>
</body>
</html>
