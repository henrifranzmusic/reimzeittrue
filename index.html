<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reimzeit</title><style>:root{--b:#090d18;--p:#131b31;--g:#f6b83f;--t:#63dfcb;--w:#f5f0e6;--m:#aab2c5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#f6b83f24,transparent 30%),radial-gradient(circle at 95% 90%,#63dfcb24,transparent 32%),var(--b);color:var(--w);font-family:system-ui}.app{max-width:1100px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{display:flex;gap:12px;align-items:center}.logo{width:55px;filter:drop-shadow(0 0 15px #f6b83f99);animation:f 3s ease-in-out infinite}@keyframes f{50%{transform:translateY(-5px) rotate(3deg)}}h1{margin:0}.sub{color:var(--m);font-size:13px}.panel{margin-top:22px;padding:20px;border-radius:18px;background:#131b31e8;border:1px solid #ffffff18;box-shadow:0 20px 45px #0005}.btn,.field{border:1px solid #ffffff22;border-radius:10px;padding:10px 12px;background:#0c1222;color:var(--w)}.btn{cursor:pointer}.btn:hover{transform:translateY(-2px);border-color:var(--g)}.gold{background:linear-gradient(135deg,#ffdc77,var(--g));color:#211605;font-weight:700}.field{width:100%;margin:5px 0}.songs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.card{padding:14px;border-radius:14px;border:1px solid #ffffff18;background:#0d1425;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-4px);border-color:var(--g)}.login{position:fixed;inset:0;display:grid;place-items:center;background:#080c16e8;z-index:9}.login.hide{display:none}.box{width:min(410px,90vw);padding:28px;border-radius:20px;background:var(--p);border:1px solid #ffffff22}.editor{display:none}.editor.show{display:block}.lyrics{min-height:320px;line-height:1.7}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #ffffff22;padding:6px 10px;border-radius:999px}.hidden{display:none}</style></head><body><div id="login" class="login"><div class="box"><svg class="logo" viewBox="0 0 64 64" fill="none"><path d="M14 45V19l25-8v26" stroke="#F6B83F" stroke-width="5"/><circle cx="14" cy="47" r="7" fill="#F6B83F"/><circle cx="39" cy="39" r="7" fill="#F6B83F"/><path d="M45 17c6 4 7 12 2 18M51 11c11 7 12 22 4 31" stroke="#63DFCB" stroke-width="3"/></svg><h1>REIMZEIT</h1><p class="sub">Dein Songwriting-Studio</p><input id="u" class="field" placeholder="Benutzername"><input id="p" class="field" type="password" placeholder="Passwort (mind. 6 Zeichen)"><button id="in" class="btn gold">Anmelden</button><button id="up" class="btn">Konto erstellen</button><p id="msg" class="sub"></p></div></div><main class="app"><header class="top"><div class="brand"><svg class="logo" viewBox="0 0 64 64" fill="none"><path d="M14 45V19l25-8v26" stroke="#F6B83F" stroke-width="5"/><circle cx="14" cy="47" r="7" fill="#F6B83F"/><circle cx="39" cy="39" r="7" fill="#F6B83F"/><path d="M45 17c6 4 7 12 2 18M51 11c11 7 12 22 4 31" stroke="#63DFCB" stroke-width="3"/></svg><div><h1>REIMZEIT</h1><span id="who" class="sub"></span></div></div><div><button id="new" class="btn gold">Neuer Song</button><button id="out" class="btn">Abmelden</button></div></header><section class="panel"><div id="list"><h2>Deine Songs</h2><div id="songs" class="songs"></div></div><div id="edit" class="editor"><button id="back" class="btn">← Übersicht</button><input id="title" class="field" placeholder="Songtitel"><textarea id="lyrics" class="field lyrics" placeholder="Schreibe deine Zeilen…"></textarea><button id="save" class="btn gold">Speichern</button><button id="del" class="btn">Löschen</button><h3>Reimfinder</h3><input id="r" class="field" placeholder="z. B. Herz"><div id="rh" class="chips"></div></div></section></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";import{getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";const app=initializeApp({apiKey:"AIzaSyBBgx_vCgk9WYX_12bKwiSfTBS0O-PTbCY",authDomain:"reimzeit-4c2b2.firebaseapp.com",projectId:"reimzeit-4c2b2",storageBucket:"reimzeit-4c2b2.firebasestorage.app",messagingSenderId:"83734399249",appId:"1:83734399249:web:4b7ec22258c859678ee4b0"}),a=getAuth(app),d=getFirestore(app),$=x=>document.getElementById(x);let user,s=[],active,unsub;const pool="Herz Schmerz Kerze Scherz Zeit weit Kleid Leid Nacht Macht Pracht Wacht Traum Raum Baum Schaum Wind Kind blind Licht nicht Gedicht Sicht Schein allein Stein Wein Feuer teuer Abenteuer Regen Segen bewegen Leben geben streben schweben Glück zurück Blick Stück Musik Kritik Magie Poesie Melodie Hand Land Sand Wand Haus Maus Applaus Zuhause Tanz Glanz Ganz Klang Gesang Anfang Stimme Sinne beginne verstehen sehen gehen stehen schreiben bleiben treiben leiden entscheiden verzeihen schreien befreien Harmonie Fantasie Energie".split(" ");function mail(n){let x=n.trim().toLowerCase().replace(/[^a-z0-9_.-]/g,"");if(x.length<3)throw Error("Name: mindestens 3 Zeichen");return x+"@reimzeit.app"}function draw(){$("songs").innerHTML=s.map(x=>`<div class="card" data-id="${x.id}"><b>${x.title||"Ohne Titel"}</b><p class="sub">${(x.lyrics||"").slice(0,70)}</p></div>`).join("")||"<p class=sub>Noch kein Song.</p>";document.querySelectorAll(".card").forEach(x=>x.onclick=()=>open(x.dataset.id))}function open(id){active=s.find(x=>x.id===id);$("list").classList.add("hidden");$("edit").classList.add("show");$("title").value=active.title||"";$("lyrics").value=active.lyrics||""}async function save(){active.title=$("title").value;active.lyrics=$("lyrics").value;active.updatedAt=Date.now();await setDoc(doc(d,"users",user.uid,"songs",active.id),active)}$("new").onclick=async()=>{active={id:"s"+Date.now(),title:"Neuer Song",lyrics:"",updatedAt:Date.now()};await save();open(active.id)};$("save").onclick=save;$("back").onclick=()=>{$("edit").classList.remove("show");$("list").classList.remove("hidden")};$("del").onclick=async()=>{await deleteDoc(doc(d,"users",user.uid,"songs",active.id));$("back").click()};$("r").oninput=()=>{let q=$("r").value.toLowerCase(),t=q.slice(-(q.length>3?3:2));$("rh").innerHTML=pool.filter(x=>x.toLowerCase().endsWith(t)&&x.toLowerCase()!=q).map(x=>`<span class=chip>${x}</span>`).join("")};function go(reg){return async()=>{try{if(reg)await createUserWithEmailAndPassword(a,mail($("u").value),$("p").value);else await signInWithEmailAndPassword(a,mail($("u").value),$("p").value)}catch(e){$("msg").textContent=e.message}}}$("in").onclick=go(false);$("up").onclick=go(true);$("out").onclick=()=>signOut(a);onAuthStateChanged(a,u=>{if(unsub)unsub();user=u;if(!u){$("login").classList.remove("hide");return}$("login").classList.add("hide");$("who").textContent=u.email.split("@")[0];unsub=onSnapshot(collection(d,"users",u.uid,"songs"),q=>{s=q.docs.map(x=>({id:x.id,...x.data()}));draw()})});</script></body></html>
